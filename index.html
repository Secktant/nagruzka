<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Нагрузка</title>
  <link rel="stylesheet" href="style.css">

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0e1116">
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Нагрузка">
</head>
<body>
  <!-- Стартовый лоадер: виден с загрузки страницы до первого render() (см. app.js).
       Экран-замок (z-index 9999) при наличии перекрывает его. -->
  <div id="boot-loader">
    <div class="boot-spin" aria-hidden="true"></div>
    <div class="boot-cap">Загрузка…</div>
  </div>
  <div class="shell">
    <div class="topbar">
      <div class="brand">Нагрузка</div>
      <div class="topbar-right">
        <div class="zoom-ctl" id="zoom-ctl" title="Масштаб">
          <button id="zoom-out" type="button" aria-label="Уменьшить">−</button>
          <span id="zoom-val">100%</span>
          <button id="zoom-in" type="button" aria-label="Увеличить">+</button>
        </div>
        <div class="month-nav" id="month-nav">
          <button id="prev-month" aria-label="Предыдущий месяц"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
          <div id="month-title"></div>
          <button id="next-month" aria-label="Следующий месяц"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
        </div>
      </div>
    </div>

    <!-- Рельс года — сестра сетки карточек, а не её элемент: #periods остаётся
         чистым гридом (на нём завязаны drop-таргеты, восстановление прокрутки и
         подсветка банка). Колонкой слева на широком, полосой сверху на узком —
         раскладку задаёт CSS, разметка о режиме не знает. -->
    <div id="view-periods" class="view">
      <div class="periods-layout">
        <aside id="year-rail" aria-label="Год"></aside>
        <div class="periods-main">
          <div id="periods"></div>
          <!-- Итоги месяца: то, чего пара карточек сказать не может (нагрузка
               месяца целиком, «внести» сводно по банкам, ближайший период).
               В режиме года скрыт — там единицей стал год, а не месяц. -->
          <section id="month-band" aria-label="Итоги месяца"></section>
        </div>
      </div>
    </div>
    <div id="view-debts" class="view" hidden></div>
    <div id="view-chart" class="view" hidden></div>
    <div id="view-money" class="view" hidden></div>
    <div id="view-settings" class="view" hidden></div>
  </div>

  <!-- Одна навигация на оба режима: снизу панель (телефон/узкое окно), слева колонка
       (широкое окно, см. медиазапрос .tabbar в style.css). Кнопки остаются
       .tab[data-tab] — обвязка в app.js/render.js от режима не зависит.
       .nav-brand/.nav-toggle видны только в режиме колонки. -->
  <nav class="tabbar" aria-label="Разделы">
    <div class="nav-brand">Нагрузка</div>
    <button class="tab active" data-tab="periods" aria-label="Периоды"><span class="ico"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9h18M8 2.5v4M16 2.5v4"/></svg></span><span class="lbl">Периоды</span></button>
    <button class="tab" data-tab="debts" aria-label="Долги"><span class="ico"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/><path d="M2.5 10h19"/></svg></span><span class="lbl">Долги</span></button>
    <button class="tab" data-tab="chart" aria-label="График"><span class="ico"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M6 16l4-5 3.5 3L20 6"/></svg></span><span class="lbl">График</span></button>
    <button class="tab" data-tab="money" aria-label="Деньги"><span class="ico"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8a2.5 2.5 0 0 1 2.5-2.5H17V8"/><rect x="3" y="8" width="18" height="11.5" rx="2.5"/><circle cx="16.5" cy="13.75" r="1.15"/></svg></span><span class="lbl">Деньги</span></button>
    <button class="tab" data-tab="settings" aria-label="Настройки"><span class="ico"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 4.3c.4-1.8 2.9-1.8 3.3 0a1.7 1.7 0 0 0 2.6 1.1c1.5-.9 3.3.8 2.4 2.4a1.7 1.7 0 0 0 1 2.5c1.8.4 1.8 2.9 0 3.3a1.7 1.7 0 0 0-1 2.6c.9 1.5-.8 3.3-2.4 2.4a1.7 1.7 0 0 0-2.6 1c-.4 1.8-2.9 1.8-3.3 0a1.7 1.7 0 0 0-2.6-1c-1.5.9-3.3-.8-2.4-2.4a1.7 1.7 0 0 0-1-2.6c-1.8-.4-1.8-2.9 0-3.3a1.7 1.7 0 0 0 1-2.5c-.9-1.6.9-3.3 2.4-2.4a1.7 1.7 0 0 0 2.6-1.1z"/><circle cx="12" cy="12" r="3"/></svg></span><span class="lbl">Настройки</span></button>
    <button class="nav-toggle" id="nav-toggle" type="button" aria-expanded="true" aria-label="Свернуть меню" title="Свернуть меню"><span class="ico"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></span><span class="lbl">Свернуть</span></button>
  </nav>

  <div id="app-version" aria-hidden="true"></div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <dialog id="modal">
    <button id="modal-close" type="button" aria-label="Закрыть"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div id="modal-body"></div>
  </dialog>

  <script src="js/vendor/argon2.umd.min.js"
          integrity="sha384-tP0Wy54CKmng7i9EoTlPySD0hBx6Octj0VS6MfwlnUu111MPa+JLm0CCbep6XJ1W"></script>
  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW:', err));
      });
    }
  </script>
</body>
</html>
