name: CI + Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Проверки, диагностика трассы или публикация
        type: choice
        options: [check, trace-probe, publish]
        default: check
      approved_run:
        description: Для main — номер успешного запуска обкатки
        type: string
      approved_attempt:
        description: Для main — попытка одобренного запуска
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ inputs.mode == 'publish' && 'pages' || format('ci-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  ci:
    name: Тесты + проверки + boot-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      # Chromium — ~130 МБ, и качался он на КАЖДЫЙ прогон. Однажды загрузка залипла
      # на 11 минут при обычной минуте на весь CI, поэтому браузер кэшируем.
      # Ключ по разрешённой версии playwright из node_modules, а не по package.json:
      # там диапазон «^1.49.0», и при обновлении внутри диапазона хеш файла не
      # изменился бы, а браузер уже нужен другой.
      - name: Версия Playwright для ключа кэша
        id: pw
        run: echo "v=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Кэш браузера Playwright
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}
      # Системные библиотеки живут вне кэшируемого каталога, поэтому при попадании
      # в кэш ставим только их — это быстрый apt, а не загрузка браузера.
      - name: Установить Chromium для Playwright
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Системные библиотеки Chromium (браузер из кэша)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Юнит-тесты (движок, крипта, синк, форматтеры)
        run: node --test
      - name: Полнота ASSETS сервис-воркера
        run: node tools/check-assets.mjs
      - name: Проверка подготовленного каталога Pages
        run: |
          node tools/release-files.mjs prepare "$RUNNER_TEMP/site" "$RUNNER_TEMP/proof"
          cd "$RUNNER_TEMP/site"
          node "$GITHUB_WORKSPACE/tools/check-assets.mjs"
      - name: Boot-smoke в реальном браузере
        env:
          TRACE_PROBE: ${{ inputs.mode == 'trace-probe' && 'boot' || '' }}
        run: node tools/smoke.mjs
      - name: Сохранность синхронизации (IndexedDB, офлайн, конфликт)
        run: npm run smoke:sync
      - name: Долги и сохранение слотов рассрочек
        run: npm run smoke:debt

      - name: Обновление PWA и восстановление бэкапа
        run: npm run smoke:release
      - name: Трассы упавших сценариев
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results/traces/*.zip
          retention-days: 14
          if-no-files-found: ignore

  deploy:
    name: Публикация на GitHub Pages
    needs: ci
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      APPROVED: ${{ inputs.approved_run }}
      ATTEMPT: ${{ inputs.approved_attempt }}
    steps:
      - uses: actions/checkout@v4
      - run: node tools/release-files.mjs prepare "$RUNNER_TEMP/site" "$RUNNER_TEMP/proof"
      - name: Проверить обязательные ресурсы в каталоге публикации
        working-directory: ${{ runner.temp }}/site
        run: node "$GITHUB_WORKSPACE/tools/check-assets.mjs"
      - name: Найти успешную публикацию одобренной попытки
        id: approved
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$APPROVED" =~ ^[1-9][0-9]*$ && "$ATTEMPT" =~ ^[1-9][0-9]*$ ]] || { echo "Укажите одобренный run и attempt"; exit 1; }
          prefix="repos/$GITHUB_REPOSITORY/actions/runs/$APPROVED/attempts/$ATTEMPT"
          run=$(gh api "$prefix")
          jq -e --arg repo "$GITHUB_REPOSITORY" '.conclusion == "success" and .event == "workflow_dispatch" and .path == ".github/workflows/ci.yml" and .head_branch != "main" and .head_repository.full_name == $repo' <<<"$run"
          gh api "$prefix/jobs" | jq -e 'any(.jobs[]; .name == "Публикация на GitHub Pages" and .conclusion == "success")'
          echo "sha=$(jq -r .head_sha <<<"$run")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: candidate-${{ inputs.approved_run }}-${{ inputs.approved_attempt }}
          run-id: ${{ inputs.approved_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/approved
      - name: Сверить состав и SHA-256 релиза с одобренным запуском
        if: github.ref == 'refs/heads/main'
        env:
          APPROVED_SHA: ${{ steps.approved.outputs.sha }}
        run: node tools/release-files.mjs verify "$RUNNER_TEMP/site" "$RUNNER_TEMP/approved" "$APPROVED" "$APPROVED_SHA" "$ATTEMPT"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      # Pages listArtifacts может ещё не видеть только что загруженный артефакт.
      - name: Дождаться индексации Pages-артефакта
        run: sleep 10
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/main'
        with:
          name: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proof
          retention-days: 90
          if-no-files-found: error
