name: CI + Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Права нужны деплою на Pages (id-token — для actions/deploy-pages).
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    name: Тесты + проверки + boot-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      # Chromium — ~130 МБ, и качался он на КАЖДЫЙ прогон. Однажды загрузка залипла
      # на 11 минут при обычной минуте на весь CI, поэтому браузер кэшируем.
      # Ключ по разрешённой версии playwright из node_modules, а не по package.json:
      # там диапазон «^1.49.0», и при обновлении внутри диапазона хеш файла не
      # изменился бы, а браузер уже нужен другой.
      - name: Версия Playwright для ключа кэша
        id: pw
        run: echo "v=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Кэш браузера Playwright
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}
      # Системные библиотеки живут вне кэшируемого каталога, поэтому при попадании
      # в кэш ставим только их — это быстрый apt, а не загрузка браузера.
      - name: Установить Chromium для Playwright
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Системные библиотеки Chromium (браузер из кэша)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Юнит-тесты (движок, крипта, синк, форматтеры)
        run: node --test
      - name: Полнота ASSETS сервис-воркера
        run: node tools/check-assets.mjs
      - name: Boot-smoke в реальном браузере
        run: node tools/smoke.mjs

  deploy:
    name: Публикация на GitHub Pages
    needs: ci
    # деплоим только при пуше в main; на PR и других ветках гоняется лишь ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
